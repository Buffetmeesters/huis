<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inloggen</title>
<style>
:root{--bg:#0b0b12;--surf:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--ink:#f2f2f8;--mute:#a4a4b9;--accent:#7c5cf0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:24px}
h1{margin:0 0 4px;font-size:1.5rem}
p{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:#ff8a8a;min-height:1.3em;margin-top:12px}
.hide{display:none}
</style>
</head>
<body>
<main class="card">
 <h1 id="t">Thuis</h1>
 <p id="s"></p>
 <div id="login" class="hide">
  <div class="tabs"><button id="b1" aria-pressed="true">Eigenaar</button><button id="b2" aria-pressed="false">Gast</button></div>
  <form id="f1">
   <label for="n">Naam</label><select id="n"></select>
   <label for="pw">Wachtwoord</label><input id="pw" type="password" autocomplete="current-password">
   <button class="go">Inloggen</button>
  </form>
  <form id="f2" class="hide">
   <label for="c">Gastcode</label><input id="c" inputmode="numeric" autocomplete="one-time-code">
   <button class="go">Inloggen</button>
  </form>
 </div>
 <form id="setup" class="hide">
  <label id="l0" for="p0"></label><input id="p0" type="password" autocomplete="new-password">
  <label id="l1" for="p1"></label><input id="p1" type="password" autocomplete="new-password">
  <label for="p2">Wachtwoord voor Admin (beheerder, optioneel)</label><input id="p2" type="password" autocomplete="new-password">
  <button class="go">Opslaan en starten</button>
 </form>
 <div class="err" id="e" role="alert"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,j:await r.json().catch(()=>({}))}));
let owners=[];
(async()=>{
 const r=await fetch('/api/me');const j=await r.json();owners=j.owners||[];
 if(j.setup){
  $('#t').textContent='Eerste keer instellen';$('#s').textContent='Kies een wachtwoord (minstens 8 tekens) voor elke eigenaar.';
  owners.forEach((o,i)=>{$('#l'+i).textContent='Wachtwoord voor '+o});$('#setup').classList.remove('hide');
 }else{
  $('#s').textContent='Log in om je huis te bedienen.';
  $('#n').innerHTML=owners.map(o=>`<option>${o}</option>`).join('');$('#login').classList.remove('hide');
 }
})();
$('#b1').onclick=()=>{$('#f1').classList.remove('hide');$('#f2').classList.add('hide');$('#b1').setAttribute('aria-pressed',true);$('#b2').setAttribute('aria-pressed',false)};
$('#b2').onclick=()=>{$('#f2').classList.remove('hide');$('#f1').classList.add('hide');$('#b2').setAttribute('aria-pressed',true);$('#b1').setAttribute('aria-pressed',false)};
const done=r=>{if(r.ok)location.reload();else $('#e').textContent=r.j.error||'Er ging iets mis.'};
$('#f1').onsubmit=async e=>{e.preventDefault();done(await post('/api/login',{name:$('#n').value,password:$('#pw').value}))};
$('#f2').onsubmit=async e=>{e.preventDefault();done(await post('/api/login',{code:$('#c').value}))};
$('#setup').onsubmit=async e=>{e.preventDefault();const b={};owners.forEach((o,i)=>b[o]=$('#p'+i).value);if($('#p2').value)b.Admin=$('#p2').value;done(await post('/api/setup',b))};
</script>
</body>
</html>
