<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Thuis – dashboard (demo)</title>
<style>
:root{--bg:#eef1f5;--surf:#fff;--surf2:#e4e8ee;--ink:#1b2430;--mute:#5d6b7c;--line:#d3d9e1;--amber:#e8920f;--amber-soft:#fbe7c4;--on-amber:#2a1a00;--blue:#2f6fed;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--surf:rgba(255,255,255,.055);--surf2:rgba(255,255,255,.1);--ink:#f2f2f8;--mute:#a4a4b9;--line:rgba(255,255,255,.1);--amber:#f5b041;--amber-soft:rgba(245,176,65,.17);--on-amber:#241500;--blue:#7c5cf0;color-scheme:dark}}
:root[data-theme="dark"]{--ring:#8fb4ff;--bg:#0b0b12;--surf:rgba(255,255,255,.055);--surf2:rgba(255,255,255,.1);--ink:#f2f2f8;--mute:#a4a4b9;--line:rgba(255,255,255,.1);--amber:#f5b041;--amber-soft:rgba(245,176,65,.17);--on-amber:#241500;--blue:#7c5cf0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--amber);display:grid;place-items:center;color:var(--on-amber)}
h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.875rem}
.grow{flex:1}
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs button{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:1rem;margin:22px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.kl{margin-top:8px;font-size:.85rem;padding:6px 10px}
.lamp{position:relative;overflow:hidden;transition:background .25s}
.lamp.on{background:var(--amber-soft);border-color:var(--amber)}
.lamp .glow{position:absolute;inset:auto -30px -50px auto;width:120px;height:120px;border-radius:50%;background:var(--amber);filter:blur(34px);opacity:0;transition:opacity .25s;pointer-events:none}
.lamp.on .glow{opacity:calc(var(--b,100)/100*.55)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.name{font-weight:600}
.state{color:var(--mute);font-size:.85rem}
.tog{width:50px;height:30px;border-radius:999px;border:0;background:var(--surf2);position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-pressed=true]{background:var(--amber)}
.tog[aria-pressed=true]::after{transform:translateX(20px)}
input[type=range]{width:100%;margin:12px 0 0;accent-color:var(--amber);position:relative}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--amber);background:var(--amber-soft)}
.btn{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--surf2);color:var(--ink)}
.film{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.film.active{border-color:var(--blue)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.mini{display:flex;gap:8px;align-items:center;margin-top:10px}
.mini .btn{padding:6px 12px}
.soon{border-style:dashed;color:var(--mute)}
.note{margin-top:28px;color:var(--mute);font-size:.8rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.item{margin-bottom:8px}
.day{margin:16px 0 6px;font-weight:700;color:var(--mute);font-size:.9rem}
.form{display:flex;flex-direction:column;gap:8px;max-width:520px}
input:not([type=range]),select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.done .name{text-decoration:line-through;color:var(--mute)}
.bar{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:6px 0}
.track{height:12px;background:var(--surf2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);border-radius:99px}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;flex:none}
.chk[aria-pressed=true]{background:var(--amber);border-color:var(--amber)}
details summary{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand{display:block;height:40px;width:auto;margin-bottom:4px;filter:brightness(1.4)}
.foot{display:block;margin:28px auto 0;width:200px;max-width:60%;filter:brightness(1.4)}
html{background:var(--bg)}
#tabs{flex-wrap:wrap;overflow:visible}
.fl{flex-basis:100%;color:var(--mute);font-size:.8rem;margin-top:4px}
label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.chip:disabled,.btn:disabled{opacity:.45;cursor:default}
body{background:radial-gradient(1100px 650px at 88% -8%,rgba(124,92,240,.24),transparent 60%),radial-gradient(900px 600px at -8% 108%,rgba(60,140,220,.2),transparent 58%),var(--bg);background-attachment:fixed}
.card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.tog::after{background:#fff}
.seg button[aria-pressed=true]{background:var(--surf2)}
.tabs button{background:var(--surf);border-color:var(--line)}
.tabs button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:transparent}
.shell{display:block}
.rail{display:none}
.bento{display:block}
.film{margin-bottom:16px}
.master{margin-bottom:12px}
.master .bri{display:flex;align-items:center;gap:12px;margin-top:6px}

.dial{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.dial svg{width:min(210px,52vw);height:auto;flex:none}
.dial .rd{width:44px;height:44px;border-radius:50%;padding:0;font-size:1.3rem}
.dl{font-size:30px;font-weight:700;fill:var(--ink)}
.ds{font-size:13px;fill:var(--mute)}
.dm{font-size:11px;fill:var(--mute)}
@media (min-width:900px){
 body{padding:20px}
 .shell{display:grid;grid-template-columns:92px minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:22px;border-radius:36px;background:rgba(18,18,28,.62);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(0,0,0,.45);min-height:calc(100vh - 40px)}
 .rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:26px;background:rgba(255,255,255,.04);border:1px solid var(--line);position:sticky;top:20px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
 .rail button{width:72px;border:0;background:none;color:var(--mute);border-radius:16px;padding:10px 2px 7px;font:inherit;font-size:.68rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
 .rail button svg{width:24px;height:24px}

 #tabs{margin-bottom:18px}
}

.ico{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.09);color:var(--mute);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.lamp.on .ico{background:var(--amber);color:var(--on-amber)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,rgba(124,92,240,.42),rgba(60,140,220,.28));border:1px solid rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hh{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.hero .hs{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hs span{background:rgba(0,0,0,.28);border-radius:999px;padding:6px 12px;font-size:.85rem}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:14px;min-height:122px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.qt .ico{margin-bottom:auto}
.qt .qn{font-weight:600;margin-top:12px}
.qt .qs{color:var(--mute);font-size:.8rem}
.qt.on{background:linear-gradient(145deg,rgba(94,234,212,.34),rgba(94,234,212,.12));border-color:rgba(94,234,212,.55)}
.qt.on .ico{background:rgba(94,234,212,.9);color:#06352e}
.qt.on .qs{color:var(--ink)}
.qt:disabled{opacity:.55;cursor:default}
.botnav{display:none}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mt{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:16px;cursor:pointer}
@media (max-width:899px){
 body{padding-bottom:104px}
 .wrap{padding:16px 14px}
 header{flex-wrap:nowrap;align-items:flex-start;margin-bottom:14px}
 h1{font-size:1.6rem}
 .seg button{padding:6px 10px;font-size:.8rem}
 #views{display:none}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .lamp .name{font-size:.95rem}
 .tog{width:46px;height:28px}
 .tog::after{width:22px;height:22px}
 .tog[aria-pressed=true]::after{transform:translateX(18px)}
 .card{border-radius:24px}
 #tabs{flex-wrap:nowrap;overflow-x:auto;align-items:center;margin-bottom:14px;scrollbar-width:none}
 #tabs::-webkit-scrollbar{display:none}
 #tabs .fl{flex:none;flex-basis:auto;margin:0 2px 0 8px;white-space:nowrap}
 #tabs button{flex:none}
 .botnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around;align-items:center;padding:8px;border-radius:34px;background:rgba(26,26,40,.82);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
 .botnav button{width:54px;height:54px;border-radius:50%;border:0;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;padding:0}
 .botnav button svg{width:25px;height:25px}
 .botnav button[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(124,92,240,.5)}
 .note{display:none}
}

</style>

<div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC.home}"/></svg></span><button class="tog" data-act="tog" data-i="${i}" aria-pressed="${l.on}" aria-label="${esc(l.n)} aan of uit"></button></div>
<div class="name" style="margin-top:10px">${esc(l.n)}</div><div class="state">${l.on?l.b+'%':'Uit'}</div>
<input type="range" min="1" max="100" value="${l.b}" data-act="bri" data-i="${i}" aria-label="Helderheid ${esc(l.n)}">${l.e&&hasW(l)?`<button class="btn alt kl" data-act="lcolbtn" data-i="${i}">Kleur</button>${S.col===S.room+':'+i?swatches('lcol',`data-i="${i}"`,l):''}`:''}</div>`}
const IC={meer:'M5 12h.01M12 12h.01M19 12h.01',overzicht:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',home:'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z',agenda:'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4',taken:'M5 12.5l4.5 4.5L19 7',boodschappen:'M3 9h18l-2 11H5zM8 9l3-5M16 9l-3-5',afval:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',recepten:'M6 3h12v18l-6-4-6 4z',ruimtes:'M4 8h16M4 16h16M9 5v6M15 13v6',groepen:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',gasten:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 19c0-3 3-5 6-5s6 2 6 5M17 11a2.5 2.5 0 1 0 0-5M21 19c0-2.2-1.6-3.8-3.5-4.4',notities:'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7'};
function dialHTML(r){const c=cc(r),mn=15,mx=28,f=(c.set-mn)/(mx-mn);let t='';
 for(let i=0;i<=40;i++){const a=(135+270*i/40)*Math.PI/180,x1=110+94*Math.cos(a),y1=110+94*Math.sin(a),x2=110+102*Math.cos(a),y2=110+102*Math.sin(a);
  t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${i/40<=f+.001?'var(--ring)':'rgba(255,255,255,.2)'}" stroke-width="2.5" stroke-linecap="round"/>`}
 const nu=String(curT(r)).replace('.',',');
 return `<div class="dial"><button class="btn alt rd" data-act="tm" aria-label="Temperatuur lager">−</button><svg viewBox="0 0 220 220" role="img" aria-label="Ingesteld op ${c.set} graden, nu ${nu} graden">${t}<circle cx="110" cy="110" r="72" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><text x="110" y="108" text-anchor="middle" class="dl">${c.set}°C</text><text x="110" y="130" text-anchor="middle" class="ds">nu ${nu}°</text><text x="48" y="200" text-anchor="middle" class="dm">${mn}°</text><text x="172" y="200" text-anchor="middle" class="dm">${mx}°</text></svg><button class="btn alt rd" data-act="tp" aria-label="Temperatuur hoger">+</button></div>`}
function render(){
 const owner=S.role==='owner';
 $('#sub').textContent=owner?'Eigenaarsweergave: alles zichtbaar':'Gastenweergave: alleen wat jullie toestaan';
 if(S.role==='guest'){if(!D.guests.find(g=>g.id===S.pg))S.pg=(D.guests[0]||{}).id;S.view=(S.view==='notities'&&myNotes().length)?'notities':'home'}
 if(!rl().some(x=>x.id===S.room)&&rl()[0])S.room=rl()[0].id;
 const vl=owner?VL:[VL.find(x=>x[0]==='home'),...(myNotes().length?[VL[VL.length-1]]:[])];
 $('#views').innerHTML=vl.map(([k,n])=>`<button data-view="${k}" aria-pressed="${S.view===k}">${n}</button>`).join('');
 $('#rail').innerHTML=vl.map(([k,n])=>`<button data-view="${k}" aria-pressed="${S.view===k}" aria-label="${n}" title="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]||IC.home}"/></svg><span>${n}</span></button>`).join('');
 const nb=owner?['overzicht','home','agenda','taken']:vl.map(x=>x[0]);
 $('#botnav').innerHTML=nb.map(k=>{const n=(VL.find(x=>x[0]===k)||[k,k])[1];return `<button data-view="${k}" aria-pressed="${S.view===k}" aria-label="${n}" title="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]||IC.home}"/></svg></button>`}).join('')+(owner?`<button data-view="meer" aria-pressed="${!nb.includes(S.view)}" aria-label="Meer" title="Meer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="${IC.meer}"/></svg></button>`:'');
 $('#title').textContent=owner?'Hoi '+D.me+'!':(G()?'Welkom, '+G().n:'Welkom');
 $('#tabs').style.display=S.view==='home'?'flex':'none';
 $('#tabs').innerHTML=FL.map((fn,f)=>{const q=rl().filter(r=>r.f===f);return q.length?`<div class="fl">${fn}</div>`+q.map(r=>`<button data-room="${r.id}" aria-pressed="${r.id===S.room}">${r.name}</button>`).join(''):''}).join('');
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
 const r=cur();
 if(!owner&&S.view!=='notities'&&(!G()||exp(G())||!rl().length)){$('#main').innerHTML=guestBar()+'<div class="card"><div class="name">Geen toegang</div><div class="state">'+(G()&&exp(G())?'De toegang van deze gast is verlopen.':'Voor deze gast staan geen kamers aan.')+'</div></div>';return}
 if(S.view!=='home'){$('#main').innerHTML=VIEWS[S.view]();return}
 const nL=r.lights.length,aL=r.lights.filter(l=>l.on).length;
 const hero=`<div class="hero"><div class="state" style="position:relative;z-index:1">${FL[r.f]}</div><div class="hh" style="position:relative;z-index:1">${esc(r.name)}</div><div class="hs">${can('licht')&&nL?`<span>${aL} van ${nL} ${nL===1?'lamp':'lampen'} aan</span>`:''}${can('klimaat')&&r.cl?`<span>${String(curT(r)).replace('.',',')}° binnen</span>`:''}</div></div>`;
 const film=can('film')&&r.id==='woon'?`<div class="card film ${S.film?'active':''}"><div><div class="name">Film kijken</div><div class="state">${S.film?'Sync box actief, woonkamer gedimd, muziek gepauzeerd':'Start de Hue Sync Box en dim de woonkamer'}</div></div><button class="btn" data-act="film">${S.film?'Stop film':'Start film'}</button></div>`:'';
 let L='',Rr='',X='';
 if(can('licht')&&r.lights.length){
  const aan=r.lights.filter(l=>l.on),avg=aan.length?Math.round(aan.reduce((a,l)=>a+l.b,0)/aan.length):0;
  L+=`<h2>Lampen in ${r.name.toLowerCase()}</h2>`+(r.lights.length>1?`<div class="card master"><div class="row"><div><div class="name">Alle lampen</div><div class="state" id="mstate">${aan.length} van ${r.lights.length} aan</div></div><button class="tog" data-act="allon" aria-pressed="${aan.length>0}" aria-label="Alle lampen aan of uit"></button></div><div class="bri"><input type="range" min="1" max="100" value="${avg||60}" data-act="allbri" aria-label="Helderheid alle lampen"><span class="state" id="mpct">${avg}%</span></div></div>`:'')+`<div class="grid">${r.lights.map(lampHTML).join('')}${S.role==='owner'?(r.sn?sensorHTML(r):'')+(r.rc?remoteHTML(r):''):''}</div>`}
 if(can('sfeer')&&r.lights.length)L+=`<h2>Sfeer</h2><div class="chips">${Object.keys(S.scenes).map(k=>`<button class="chip" data-act="scene" data-k="${k}" aria-pressed="${S.scene===k}">${k}</button>`).join('')}</div>`;
 if(can('muziek')&&r.sp)Rr+=`<h2>Muziek</h2><div class="card"><div class="name">Speaker ${esc(r.name.toLowerCase())}</div><div class="state">${S.media.track}</div>
 <div class="mini"><button class="btn" data-act="play">${S.media.playing?'Pauze':'Afspelen'}</button><span class="state">Volume ${S.media.vol}%</span></div>
 <input type="range" min="0" max="100" value="${S.media.vol}" data-act="vol" aria-label="Volume"></div>`;
 if(can('klimaat')&&r.cl)Rr+=`<h2>Klimaat</h2><div class="card dialcard"><div class="row"><div class="name">Temperatuur</div><div class="row" style="gap:10px"><span class="state">Airco ${S.clim.air?'aan':'uit'}</span><button class="tog" data-act="air" aria-pressed="${S.clim.air}" aria-label="Airco aan of uit"></button></div></div>${dialHTML(r)}</div>`;
 if(r.id==='voordeur')X+=`<h2>Voordeur</h2><div class="grid"><div class="card soon"><div class="name">Videodeurbel</div><div class="state">Live beeld, beltoon en opnames volgen met de koppeling. Alleen zichtbaar voor Joshua en Lorenzo.</div></div></div>`;
 if(owner){X+=`<h2>Alleen voor jullie</h2><div class="grid">
 <div class="card soon"><div class="name">Videodeurbel</div><div class="state">Koppelen in fase 2</div></div>
 <div class="card soon"><div class="name">Camera’s</div><div class="state">3 camera’s volgen later</div></div>
 <div class="card soon"><div class="name">Deursensoren</div><div class="state">Volgen later</div></div>
 <div class="card"><div class="name">Systeem</div><div class="state">Home Assistant, Hue Bridge en back-up: demo</div></div>
 <div class="card"><div class="name">Cloud</div><div class="state">Foto’s en bestanden</div><div class="mini"><button class="btn alt">Openen</button></div></div></div>`}
 $('#main').innerHTML=guestBar()+hero+film+((L||Rr)?`<div class="bento">${L?`<div class="colL">${L}</div>`:''}${Rr?`<div class="colR">${Rr}</div>`:''}</div>`:'')+X;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 const r=cur();
 if(t.dataset.role){S.role=t.dataset.role;render();return}
 if(t.dataset.room){S.room=t.dataset.room;render();return}
 if(t.dataset.view){S.view=t.dataset.view;render();return}
 const a=t.dataset.act;if(!a)return;
 if(!['roomdel','gdel','sdel'].includes(a))S.cd=null;
 if(act2(a,t)){save();render();return}
 if(a==='tog'){const l=r.lights[+t.dataset.i];l.on=!l.on;S.scene=null}
 if(a==='qlights'){S.rooms.forEach(q=>q.lights.forEach(l=>l.on=false));S.scene=null}
 if(a==='qair'){S.rooms.forEach(q=>{if(q.c)q.c.air=false})}
 if(a==='allon'){const any=r.lights.some(l=>l.on);r.lights.forEach(l=>l.on=!any);S.scene=null}
 if(a==='scene'){const p=S.scenes[t.dataset.k].p;r.lights.forEach((l,i)=>{const v=p[i]??0;l.on=v>0;if(v>0)l.b=v});S.scene=t.dataset.k}
 if(a==='play'){S.media.playing=!S.media.playing;S.media.track=S.media.playing?'Speellijst: Zondagmiddag':'Gepauzeerd'}
 if(a==='tp')S.clim.set=Math.min(28,S.clim.set+1);
 if(a==='tm')S.clim.set=Math.max(15,S.clim.set-1);
 if(a==='air')S.clim.air=!S.clim.air;
 if(a==='film'){S.film=!S.film;const w=S.rooms[0];
  if(S.film){w.lights.forEach(l=>{l.on=false});S.media.playing=false;S.media.track='Gepauzeerd'}
  else{w.lights.forEach((l,i)=>{l.on=i<2;l.b=[70,45][i]||l.b})}
  S.scene=null}
 if(a==='lcolbtn'){const k=S.room+':'+i0(t);S.col=S.col===k?null:k}
 if(a==='lcol'){const l=r.lights[+t.dataset.i],c=colSpec(t.dataset.v);if(l&&l.e)applyItems([{e:l.e,on:true,b:l.b,...c}])}
 if(a==='gcolbtn')S.gcol=S.gcol===t.dataset.g?null:t.dataset.g;
 if(a==='gtog'||a==='gcol'||a==='sapply'){
  const A=allLights();let items=[];
  if(a==='sapply'){const c=(D.scn||[]).find(x=>x.id===t.dataset.s);if(c)items=c.items.filter(it=>A.some(x=>x.e===it.e))}
  else{const g=(D.groups||[]).find(x=>x.id===t.dataset.g);if(g){const ls=A.filter(x=>g.e.includes(x.e));
   if(a==='gtog'){const on=!ls.some(x=>x.l.on);items=ls.map(x=>on?{e:x.e,on:true,b:x.l.b}:{e:x.e,on:false})}
   else{const c=colSpec(t.dataset.v);items=ls.map(x=>({e:x.e,on:true,b:x.l.b,...c}))}}}
  if(items.length)applyItems(items)}
 pushAll();render();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.act==='bri'){const l=cur().lights[+t.dataset.i];l.b=+t.value;l.on=true;S.scene=null;
  const c=t.closest('.lamp');c.style.setProperty('--b',l.b);c.classList.add('on');c.querySelector('.state').textContent=l.b+'%';c.querySelector('.tog').setAttribute('aria-pressed','true')}
 if(t.dataset.act==='allbri'){const v=+t.value,q=cur();q.lights.forEach(l=>{l.b=v;l.on=true});S.scene=null;
  document.querySelectorAll('.lamp').forEach(c=>{c.style.setProperty('--b',v);c.classList.add('on');const s=c.querySelector('.state');if(s)s.textContent=v+'%';const g=c.querySelector('.tog');if(g)g.setAttribute('aria-pressed','true');const i=c.querySelector('input');if(i)i.value=v});
  const a=document.getElementById('mstate'),b=document.getElementById('mpct');if(a)a.textContent=q.lights.length+' van '+q.lights.length+' aan';if(b)b.textContent=v+'%'}
 
if(t.dataset.act==='vol'){S.media.vol=+t.value;t.closest('.card').querySelector('.mini .state').textContent='Volume '+S.media.vol+'%'}
});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
 if(a==='bri'||a==='allbri'){pushAll();return}
 if(a==='gbri'){const g=(D.groups||[]).find(x=>x.id===t.dataset.g);if(g){const b=+t.value;applyItems(allLights().filter(x=>g.e.includes(x.e)).map(x=>({e:x.e,on:true,b})));render()}return}
 if(a==='trep'){S.tn=(document.getElementById('tn')||{}).value||'';S.tpv=(document.getElementById('tp')||{}).value||'1';S.trep=t.value;render();return}
 if(a==='rphoto'||a==='rnewphoto'){const f=t.files&&t.files[0];if(!f)return;readImg(f,d=>{if(a==='rphoto'){D.recipes[+t.dataset.i].img=d;S.or=+t.dataset.i;save();render()}else{S.rimg=d;const p=document.getElementById('rprev');if(p){p.src=d;p.style.display='block'}}});return}if(a==='guntil'){const g=D.guests[+t.dataset.i];g.until=t.value;S.og=g.id;save();render();return}
 if(a==='rname'||a==='rfl'||a==='lname'||a==='lent'){const q=S.rooms.find(x=>x.id===t.dataset.r);if(!q)return;
  if(a==='rname'){const n=t.value.trim();if(n)q.name=n}
  else if(a==='rfl')q.f=+t.value;
  else if(a==='lent'){const l=q.lights[+t.dataset.j];if(l){if(t.value)l.e=t.value;else delete l.e}}
  else{const n=t.value.trim(),l=q.lights[+t.dataset.j];if(n&&l)l.n=n}
  S.redit=1;S.orr=q.id;save();render()}});
document.addEventListener('click',async e=>{if(e.target.id==='logout'){try{localStorage.removeItem('huis-d2');localStorage.removeItem('huis-r')}catch(x){}try{await fetch('/api/logout',{method:'POST'})}catch(x){}location.reload()}});
(async()=>{
let fromSrv=false,ME=null;
try{const r=await fetch('/api/me');if(r.status!==200){location.reload();return}ME=await r.json()}catch(e){}
GUEST=!!ME&&ME.role==='guest';
if(GUEST){try{localStorage.removeItem('huis-d2');localStorage.removeItem('huis-r')}catch(e){}}
let srvD=null;
try{const r=await fetch('/api/state/data');if(r.status===200){srvD=await r.text();fromSrv=true;if(!GUEST)localStorage.setItem('huis-d2',srvD)}}catch(e){}
try{const r=await fetch('/api/state/rooms');if(r.status===200){const t=await r.text();if(!GUEST)localStorage.setItem('huis-r',t);else{const rr=JSON.parse(t);if(Array.isArray(rr)&&rr.length){S.rooms=rr;S.redit=1}}}}catch(e){}
if(GUEST&&srvD){try{Object.assign(D,JSON.parse(srvD))}catch(e){}}
if(!GUEST)try{const x=JSON.parse(localStorage.getItem('huis-d2'));if(x)Object.assign(D,x)}catch(e){}
if(!GUEST)try{const rr=JSON.parse(localStorage.getItem('huis-r'));if(Array.isArray(rr)&&rr.length){S.rooms=rr;S.redit=1}}catch(e){}
D.tasks.forEach((t,k)=>{if(!t.id)t.id='t'+k+'x'+Date.now();if(t.rep===undefined)t.rep=''});if(!D.log)D.log=D.tasks.filter(t=>t.by).map(t=>({tid:t.id,w:t.by,p:t.p,d:iso(0),n:t.n}));resetDue();
if(!D.afval)D.afval=[];seedAfval();if(!D.addr)D.addr='Frans Staelstraat 29, 5281 CW Boxtel';
if(!D.notes)D.notes=[];if(!D.groups)D.groups=[];if(!D.scn)D.scn=[];D.guests=D.guests.filter(g=>g.id!=='dennis'||g.rp);D.guests.forEach(g=>{if(!g.rp){g.rp={};(g.rooms||[]).forEach(id=>{if(S.rooms.some(r=>r.id===id))g.rp[id]=Object.fromEntries(KS(id).filter(k=>(g.perm||{})[k]).map(k=>[k,1]))})}});if(!D.guests.some(g=>g.id==='dennis'))D.guests.unshift({id:'dennis',n:'Dennis',until:'',code:cd(),rp:Object.fromEntries(S.rooms.map(r=>[r.id,Object.fromEntries(KS(r.id).map(k=>[k,1]))]))});
if(ME){D.me=ME.name;if(GUEST){const h=document.getElementById('hal');if(h)h.style.display='none';S.role='guest';S.pg=ME.id;const sg=document.querySelector('.seg');if(sg)sg.style.display='none'}}
if(ME&&ME.role==='owner'){try{const r=await fetch('/api/ha/entities');if(r.status===200)HAL=(await r.json()).entiteiten.filter(x=>x.id.startsWith('light.'))}catch(e){}}
render();
if(!fromSrv)save();
pollLights(true);setInterval(pollLights,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLights(true)});
})();
</script>
