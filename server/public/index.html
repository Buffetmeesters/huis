.film{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.film.active{border-color:var(--blue)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.mini{display:flex;gap:8px;align-items:center;margin-top:10px}

.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function tijdwissel(now){const y=now.getFullYear(),t0=new Date(y,now.getMonth(),now.getDate(),12);
 const lz=m=>{const d=new Date(y,m,31,12);d.setDate(31-d.getDay());return d};
 for(const [m,vooruit] of [[2,true],[9,false]]){const d=lz(m),dd=Math.round((d-t0)/864e5);
  if(dd>=0&&dd<=3){const dl=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da,12)}

S.rooms.forEach(r=>{r.name=r.name.replace(/\s*\d+\s*m²\s*$/,'')});if(!D.notes)D.notes=[];if(!D.phr)D.phr=[{t:'Het eten is klaar, we kunnen gaan eten',fl:[0,1,2]},{t:'Lorenzo, schatje, je moet wakker worden',fl:[1]},{t:'Kom je even naar beneden?',fl:[0,1,2]}];if(!D.spf)D.spf={};if(!D.rcat)D.rcat=['Eten','Cocktails'];D.recipes.forEach(r=>{if(r.c===undefined)r.c='Eten'});if(!GUEST&&!D.rec1){D.rec1=1;if(!D.recipes.some(r=>/champignons room kip/i.test(r.n)))D.recipes.unshift({n:'Champignons room kip',m:30,k:20,p:6,t:['Heel eenvoudig','Smaakt te gek'],d:'Snijd champignons in partjes of plakjes.\nSnijd de kip in blokjes.\nSnijd de knoflook zo dun mogelijk.\nSnijd 2 grote uien fijn.\n\nZet een grote pan op het vuur en doe daar bakboter in.\nDoe daar 4 tenen gesneden knoflook en 1 grote fijn gesneden ui in en bak dit aan tot de uien wat glazig zijn. Vervolgens gooi je er rijst bij: 1 koffiekopje is voor 1 persoon, dit bakje even meebakken. Daarna doe je per kopje rijst anderhalf glas water erbij, dus 2 kopjes rijst is 3 glazen water. Goed roeren, deksel op de pan en zodra het water weg is, is de rijst klaar.\n\nJe pakt nog 1 pan, voorkeur is een braadpan.\nOok hier doe je bakboter in. Zodra de boter een beetje bruin is, doe je hier 2 tenen gesneden knoflook in en 1 ui fijn gesneden en bak aan tot de ui weer glazig is. Dan doe je de kip erbij met zout naar smaak en peper naar smaak. Zodra de kip gaar is gebakken doe je de 4 flesjes kookroom erbij. Goed roeren en goed verwarmen. Een beetje peterselie erdoor heen en klaar.\n\nJe pakt een bord, schept daar de knoflookrijst op en doet er 1 of 2 lepels van de saus op. Klein beetje peterselie of bieslook erover en smakelijk eten.',i:'3 grote bakken champignons\n4 x kookroom\n3 stukken kipfilet\nZout\nPeper\nZilvervliesrijst\n6 tenen knoflook\nPeterselie\n2 grote uien of zak fijn gesneden uien',s:'',img:'',c:'Eten'});save()}
if(!GUEST&&!D.rec3){D.rec3=1;if(!D.recipes.some(r=>/huisgemaakte erwtensoep/i.test(r.n)))D.recipes.push({"n": "Huisgemaakte erwtensoep", "m": 120, "k": 360, "p": 40, "t": ["Smaakt te gek", "Soepen"], "c": "Eten", "d": "", "i": "8 L water\n4 winterpeen\n3 prei\n3 ui\n2 kg spliterwten\n1 knolselderij incl. blad\n1 Gelderse rookworst\n1 magere rookworst\n1 blokje Maggi runderbouillon\n2 mergpijpen\n3 runderriblap\n2 varkenskarbonade\n9 aardappelen", "s": "24 uur voordat je aan de soep wilt beginnen, dien je de spliterwten te weken in een grote bak met water.\n\nZet een grote pan met 8L water op.\n\nVoeg hierbij 1 prei in stukken, 1 winterpeen in stukken, 2 halve uien, 1 bouillonblokje, het varkensvlees, rundvlees en de mergpijpen (voor de bouillon).\n\nLaat dit koken tot je vlees door en door gaar is.\n\nVerwijder alle groente en gooi deze weg.\n\nVerwijder het vlees uit de pan, pull deze tot lekkere pulled pork en pulled beef.\n\nSnijd de prei in kwart ringen.\n\nSnijd de wortel brunoise.\n\nSnijd de ui in halve ringen.\n\nSnijd de knolselderij brunoise.\n\nSnipper het selderijblad.\n\nSnijd de aardappelen brunoise.\n\nSpoel de spliterwten met schoon water af.\n\nSnijd beide rookworsten in halve plakjes.\n\nVoeg de spliterwten, wortel, prei, ui, knolselderij incl. blad, aardappel en je pulled beef en pork in de pan met verse bouillon.\n\nZet op middelhoog vuur zodat dit door kan koken.\n\nWanneer je ziet dat de spliterwten kapotgekookt zijn, dien je gemiddeld elke 5 minuten goed door te roeren en vooral ook de bodem.\n\nWanneer je geen spliterwten meer tegenkomt tijdens het roeren, mag je je vuur op laag zetten en de rookworsten toevoegen.\n\nLaat dit op een laag vuur 10 min doorpruttelen.\n\nZet vervolgens het vuur uit, en je kunt inscheppen.\n\nSmullen, maar pas wel op, erwtensoep is mega heet.\n\nLekker met roggebrood met katenspek.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJ
