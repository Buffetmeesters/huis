<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1b2748">
<title>Verhuizing – Huis</title>
<style>
:root{--bg:#f2f4f8;--kaart:#fff;--ink:#141c2e;--mute:#5e6a80;--lijn:#d9dfe8;--acc:#1b2748;--ok:#1a7f4b;--okz:#e3f3ea;--geel:#f2b531;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1220;--kaart:#161e30;--ink:#e9edf5;--mute:#9aa6bb;--lijn:#26314a;--acc:#9fb4e8;--ok:#3fbf7f;--okz:#13301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#1b2748;color:#fff;padding:16px 18px 18px}
header .b{max-width:860px;margin:0 auto}
.rij{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem}
header a{color:#fff;margin-left:auto;font-size:.9rem}
.sub{color:#c9d3ea;font-size:.92rem;margin-top:2px}
.voortgang{margin-top:14px;background:rgba(255,255,255,.18);border-radius:99px;height:12px;overflow:hidden}
.voortgang i{display:block;height:100%;width:0;background:var(--geel);border-radius:99px;transition:width .3s}
.telling{margin-top:6px;font-size:.92rem;color:#e6ebf7}
main{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.filters button{font:inherit;font-size:.9rem;border:1px solid var(--lijn);background:var(--kaart);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
section{background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;margin:0 0 12px;overflow:hidden}
section h2{margin:0;font-size:1.02rem;padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--lijn)}
section h2 small{margin-left:auto;font-weight:500;color:var(--mute);font-size:.85rem}
section.af h2{color:var(--ok)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid var(--lijn)}
li:first-child{border-top:0}
li input[type=checkbox]{width:24px;height:24px;margin:1px 0 0;flex:none;accent-color:var(--ok);cursor:pointer}
.tekst{flex:1;min-width:0}
.tekst span{display:block;word-wrap:break-word}
li.klaar .tekst span{text-decoration:line-through;color:var(--mute)}
li.klaar{background:var(--okz)}
.meta{font-size:.8rem;color:var(--mute);margin-top:1px}
.wie{font:inherit;font-size:.8rem;border:1px solid var(--lijn);border-radius:99px;padding:3px 9px;background:transparent;color:var(--mute);cursor:pointer;flex:none;white-space:nowrap}
.wie.J{border-color:#4a7bd0;color:#4a7bd0}.wie.L{border-color:#b0569b;color:#b0569b}.wie.S{border-color:var(--ok);color:var(--ok)}
.weg{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 4px;flex:none}
.weg:hover{color:#c0392b}
.nieuw{display:flex;gap:8px;padding:9px 14px;border-top:1px solid var(--lijn)}
.nieuw input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--lijn);border-radius:9px;background:var(--bg);color:var(--ink)}
.nieuw button,.kamerknop{font:inherit;font-size:.9rem;border:0;border-radius:9px;padding:7px 12px;background:var(--acc);color:var(--bg);cursor:pointer}
.kamer{display:flex;gap:8px;margin-top:6px}
.kamer input{flex:1;font:inherit;padding:9px 12px;border:1px solid var(--lijn);border-radius:10px;background:var(--kaart);color:var(--ink)}
.leeg{color:var(--mute);padding:14px}
.tijden{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tijden span{background:rgba(255,255,255,.14);border-radius:9px;padding:5px 10px;font-size:.88rem}
.tijden b{color:var(--geel)}
.weergave{display:flex;gap:6px;margin:12px 0 4px}
.weergave button{flex:1;font:inherit;font-size:.92rem;border:1px solid var(--lijn);background:var(--kaart);color:var(--ink);border-radius:10px;padding:8px;cursor:pointer}
.weergave button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:650}
section.vandaag{border-color:var(--geel);box-shadow:0 0 0 2px var(--geel)}
section.verhuisdag h2{background:rgba(242,181,49,.16)}
.lbl{display:inline-block;font-size:.75rem;color:var(--mute);border:1px solid var(--lijn);border-radius:6px;padding:0 6px;margin-right:6px}
.dag{font:inherit;font-size:.8rem;border:1px solid var(--lijn);border-radius:99px;padding:3px 6px;background:transparent;color:var(--mute);flex:none;max-width:6.5rem}
.knoppen{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none}
.fout{background:#fdecea;color:#8a1c1c;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--geel);outline-offset:2px}
</style>
</head>
<body>
<header><div class="b">
  <div class="rij"><h1>Verhuizing</h1><a href="/">Terug naar Huis</a></div>
  <div class="sub">Van Stapelen 76, 5281 EJ naar Frans Staelstraat 29, 5281 CW Boxtel · alleen voor Joshua en Lorenzo</div>
  <div class="tijden"><span>Aanhanger ophalen <b>ma 30 nov 08:00</b></span><span>Sleutels nieuw huis <b>di 1 dec 10:30</b></span><span>Oude sleutels inleveren <b>di 15:00</b></span><span>Aanhanger terug <b>wo 2 dec voor 22:00</b></span><span id="aftellen"></span></div>
  <div class="voortgang" aria-hidden="true"><i id="balk"></i></div>
  <div class="telling" id="telling">Laden…</div>
</div></header>
<main>
  <div class="fout" id="fout"></div>
  <div class="weergave" role="group" aria-label="Weergave"><button data-v="dag" aria-pressed="true">Per dag</button><button data-v="kamer" aria-pressed="false">Per kamer</button></div>
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="open" aria-pressed="true">Nog te doen</button>
    <button data-f="alles" aria-pressed="false">Alles</button>
    <button data-f="mij" aria-pressed="false">Mijn taken</button>
    <button data-f="klaar" aria-pressed="false">Klaar</button>
  </div>
  <div id="lijst"></div>
  <form class="kamer" id="kamerform">
    <input id="kamernaam" placeholder="Nieuwe kamer of groep (bijv. Zolder)" maxlength="60" aria-label="Nieuwe kamer of groep">
    <button class="kamerknop">Toevoegen</button>
  </form>
</main>
<script>
const WIE=['','Joshua','Lorenzo','Samen'], KORT={Joshua:'J',Lorenzo:'L',Samen:'S'};
const DAGEN=['2026-11-27','2026-11-28','2026-11-29','2026-11-30','2026-12-01','2026-12-02','na'];
const DAGNAAM={'2026-11-27':'Vrijdag 27 november','2026-11-28':'Zaterdag 28 november','2026-11-29':'Zondag 29 november','2026-11-30':'Maandag 30 november · aanhanger ophalen (vanaf 08:00)','2026-12-01':'Dinsdag 1 december · verhuisdag (10:30 sleutels, 15:00 inleveren)','2026-12-02':'Woensdag 2 december · aanhanger terug (voor 22:00)','na':'Na de verhuizing','':'Nog geen dag'};
const DAGKORT={'2026-11-27':'vr 27','2026-11-28':'za 28','2026-11-29':'zo 29','2026-11-30':'ma 30','2026-12-01':'di 1','2026-12-02':'wo 2','na':'daarna','':'dag?'};
let D={taken:[]}, ik='', filter='open', weergave=localStorage.getItem('vh-weergave')||'dag', extra=[], bezig=false;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vandaag=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fout(t){const f=$('#fout');f.textContent=t||'';f.style.display=t?'block':'none'}
async function api(pad,b){
  bezig=true;
  try{const r=await fetch('/api/verhuis'+pad,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Mislukt');D=d;fout('');teken();}
  catch(e){fout(e.message==='Alleen Joshua en Lorenzo'?'Deze pagina is alleen voor Joshua en Lorenzo.':'Opslaan of laden lukte niet: '+e.message)}
  finally{bezig=false}
}
function tijd(ms){const d=new Date(ms);return d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}
function aftellen(){const nu=new Date(),doel=new Date('2026-12-01T10:30:00'),ms=doel-nu;
  $('#aftellen').textContent=ms<=0?'Verhuisdag!':(ms<864e5?'Nog '+Math.ceil(ms/36e5)+' uur':'Nog '+Math.ceil(ms/864e5)+' dagen')}
function rij(x){
  const dagSel='<select class="dag" data-dag="'+x.id+'" aria-label="Dag">'+['',...DAGEN].map(d=>'<option value="'+d+'"'+((x.d||'')===d?' selected':'')+'>'+DAGKORT[d]+'</option>').join('')+'</select>';
  return '<li class="'+(x.klaar?'klaar':'')+'"><input type="checkbox" data-id="'+x.id+'" '+(x.klaar?'checked':'')+' aria-label="Klaar: '+esc(x.t)+'">'
    +'<div class="tekst"><span>'+(weergave==='dag'?'<i class="lbl">'+esc(x.k)+'</i>':'')+esc(x.t)+'</span>'+(x.klaar&&x.door?'<div class="meta">Gedaan door '+esc(x.door)+' · '+tijd(x.op)+'</div>':'')+'</div>'
    +'<div class="knoppen"><button class="wie '+(KORT[x.w]||'')+'" data-wie="'+x.id+'" title="Wie doet het? (tik om te wisselen)">'+(x.w||'Wie?')+'</button>'+dagSel+'</div>'
    +'<button class="weg" data-weg="'+x.id+'" aria-label="Verwijderen" title="Verwijderen">×</button></li>';
}
function teken(){
  const t=D.taken, k=t.filter(x=>x.klaar).length, pct=t.length?Math.round(k/t.length*100):0;
  $('#balk').style.width=pct+'%';
  $('#telling').textContent=k+' van '+t.length+' klaar ('+pct+'%)'+(t.length-k?' · nog '+(t.length-k)+' te doen':' · alles klaar!');
  aftellen();
  const zie=x=>filter==='alles'||(filter==='open'&&!x.klaar)||(filter==='klaar'&&x.klaar)||(filter==='mij'&&!x.klaar&&(x.w===ik||x.w==='Samen'||!x.w));
  const groepen = weergave==='dag'
    ? [...DAGEN, ''].filter(d=>d!==''||t.some(x=>!x.d)).map(d=>({sleutel:d,naam:DAGNAAM[d],alle:t.filter(x=>(x.d||'')===d)}))
    : [...new Set(t.map(x=>x.k).concat(extra))].map(km=>({sleutel:km,naam:km,alle:t.filter(x=>x.k===km)}));
  const nu=vandaag(); let h='';
  for(const g of groepen){
    const rijen=g.alle.filter(zie), af=g.alle.length&&g.alle.every(x=>x.klaar);
    if(!rijen.length&&filter!=='alles'&&!extra.includes(g.sleutel)&&!(weergave==='dag'&&g.sleutel===nu))continue;
    const kl=[af?'af':'',weergave==='dag'&&g.sleutel===nu?'vandaag':'',g.sleutel==='2026-12-01'?'verhuisdag':''].join(' ');
    h+='<section class="'+kl+'"><h2>'+(af?'✓ ':'')+(weergave==='dag'&&g.sleutel===nu?'Vandaag · ':'')+esc(g.naam)+'<small>'+g.alle.filter(x=>x.klaar).length+'/'+g.alle.length+'</small></h2><ul>';
    h+=rijen.map(rij).join('');
    h+='</ul><form class="nieuw" data-g="'+esc(g.sleutel)+'"><input placeholder="Taak toevoegen…" maxlength="200" aria-label="Taak toevoegen"><button>+</button></form></section>';
  }
  $('#lijst').innerHTML=h||'<p class="leeg">'+(filter==='klaar'?'Nog niets afgevinkt.':'Niets meer te doen in deze weergave. 🎉')+'</p>';
  $('#kamerform').style.display=weergave==='kamer'?'flex':'none';
}
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(id)return api('/klaar',{id,klaar:e.target.checked});
  const dg=e.target.dataset&&e.target.dataset.dag;if(dg)api('/dag',{id:dg,d:e.target.value});
});
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-wie]');if(w){const x=D.taken.find(t=>t.id===w.dataset.wie);api('/wie',{id:x.id,w:WIE[(WIE.indexOf(x.w||'')+1)%WIE.length]});return}
  const g=e.target.closest('[data-weg]');if(g){const x=D.taken.find(t=>t.id===g.dataset.weg);if(confirm('Taak verwijderen?\n\n'+x.t))api('/weg',{id:x.id});return}
  const f=e.target.closest('.filters button');if(f){filter=f.dataset.f;document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b===f));teken();return}
  const v=e.target.closest('.weergave button');if(v){weergave=v.dataset.v;try{localStorage.setItem('vh-weergave',weergave)}catch(_){}document.querySelectorAll('.weergave button').forEach(b=>b.setAttribute('aria-pressed',b===v));teken()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='kamerform'){const v=$('#kamernaam').value.trim();if(v&&!extra.includes(v)){extra.push(v);$('#kamernaam').value='';teken()}return}
  const g=e.target.dataset.g,i=e.target.querySelector('input'),v=i.value.trim();if(!v)return;
  if(weergave==='dag')api('/nieuw',{k:'Overig',t:v,d:g});else{extra=extra.filter(x=>x!==g);api('/nieuw',{k:g,t:v})}
});
document.querySelectorAll('.weergave button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===weergave));
fetch('/api/me').then(r=>r.ok?r.json():{}).then(m=>{ik=m.name||''}).catch(()=>{});
api('');
setInterval(()=>{if(!bezig&&!document.querySelector('.nieuw input:focus,#kamernaam:focus,select:focus')&&!document.hidden)api('')},20000);
</script>
</body>
</html>
