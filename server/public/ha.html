<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Assistant koppelen</title>
<style>
:root{--bg:#0b0b12;--surf:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--ink:#f2f2f8;--mute:#a4a4b9;--accent:#7c5cf0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto}
a{color:var(--mute)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}
h1{margin:8px 0 0;font-size:1.5rem}h2{margin:0 0 8px;font-size:1.05rem}
p{color:var(--mute);margin:6px 0}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
button{margin-top:16px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.ok{color:#7be0a4}.err{color:#ff8a8a}
ul{list-style:none;padding:0;margin:8px 0 0}li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
li span:last-child{color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
 <a href="/">← Terug naar het dashboard</a>
 <h1>Home Assistant koppelen</h1>
 <div class="card">
  <label for="u">Adres van Home Assistant</label>
  <input id="u" value="http://192.168.178.68:8123" autocapitalize="off">
  <label for="t">Toegangstoken (long-lived access token)</label>
  <input id="t" type="password" autocomplete="off" placeholder="Plak hier het token">
  <p id="ts"></p>
  <button id="save">Opslaan en testen</button>
  <p id="msg" role="status"></p>
 </div>
 <h1 style="margin-top:28px">Internettoegang (Cloudflare)</h1>
 <div class="card">
  <p>Plak hier het tunneltoken uit Cloudflare. Het wordt op de server bewaard en de tunnel start daarna vanzelf, meestal binnen een minuut.</p>
  <label for="ct">Tunneltoken</label>
  <input id="ct" type="password" autocomplete="off" placeholder="eyJ...">
  <p id="cs"></p>
  <button id="csave">Opslaan</button>
  <p id="cmsg" role="status"></p>
 </div>
 <div class="card" id="ents" hidden><h2>Gevonden apparaten</h2><p id="cnt"></p><ul id="list"></ul></div>
</div>
<script>
const $=s=>document.querySelector(s);
const api=(m,u,b)=>fetch(u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(async r=>({ok:r.ok,j:await r.json().catch(()=>({}))}));
const say=(t,c)=>{$('#msg').textContent=t;$('#msg').className=c||''};
async function test(){
 say('Verbinding testen…');
 const s=await api('GET','/api/ha/status');
 if(!s.ok)return say(s.j.error||'Mislukt','err');
 say('Verbonden met "'+s.j.naam+'" (versie '+s.j.versie+').','ok');
 const e=await api('GET','/api/ha/entities');
 if(e.ok){$('#ents').hidden=false;$('#cnt').textContent=e.j.aantal+' apparaten (lampen, klimaat, spelers, sensoren…)';
  $('#list').innerHTML=e.j.entiteiten.map(x=>`<li><span>${x.naam.replace(/</g,'&lt;')}<br><small style="color:var(--mute)">${x.id}</small></span><span>${x.staat}</span></li>`).join('')}
}
$('#save').onclick=async()=>{
 const b={url:$('#u').value};if($('#t').value)b.token=$('#t').value;
 const r=await api('PUT','/api/ha/config',b);
 if(!r.ok)return say(r.j.error||'Opslaan mislukt','err');
 $('#t').value='';$('#ts').textContent='Token is opgeslagen op de server.';
 test();
};
$('#csave').onclick=async()=>{const r=await api('PUT','/api/cf/token',{token:$('#ct').value});
 $('#cmsg').className=r.ok?'ok':'err';$('#cmsg').textContent=r.ok?'Opgeslagen. De tunnel start nu vanzelf; dat kan een minuut duren.':(r.j.error||'Mislukt');
 if(r.ok){$('#ct').value='';$('#cs').textContent='Tunneltoken is opgeslagen op de server.'}};
(async()=>{const r=await api('GET','/api/cf/token');if(r.ok&&r.j.set)$('#cs').textContent='Tunneltoken is opgeslagen op de server.'})();
(async()=>{const c=await api('GET','/api/ha/config');if(c.ok){if(c.j.url)$('#u').value=c.j.url;if(c.j.tokenSet){$('#ts').textContent='Token is opgeslagen op de server.';test()}}})();
</script>
</body>
</html>
